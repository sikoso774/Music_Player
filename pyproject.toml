readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "mutagen>=1.47.0",
    "packaging>=26.0",
    "pillow>=12.1.0",
    "pygame-ce>=2.5.6",
]
