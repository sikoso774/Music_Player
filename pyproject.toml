[project]
name = "music-player-v3"
version = "0.1.0"
description = "My music player"
authors = [
    {name = "Zoléni Kokolo Zassi",email = "zolenikokolozassi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce (>=2.5.5,<3.0.0)",
    "mutagen (>=1.47.0,<2.0.0)",
    "customtkinter (>=5.2.2,<6.0.0)",
    "playsound3 (>=3.2.4,<4.0.0)",
    "lyricsgenius (>=3.6.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
